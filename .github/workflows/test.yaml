name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.17.4
      - run: ruff check .
      - run: ruff format --check .
      - name: Generated vendor and Core copies match their sources
        run: |
          python tools/vendor_library.py
          git diff --exit-code

  library-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest pytest-asyncio probatio==0.13.0 tzdata
      - run: python -m pytest -q device_library/tests
      - run: python -m pytest -q tests
      - run: python -m compileall -q custom_components

  home-assistant-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-test-runtime.txt
      - run: python -m pytest -q runtime_tests
      - run: python tools/package.py
      - run: python tools/validate_release.py
