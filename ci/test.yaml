name: Custom integration checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  adapter-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest pytest-asyncio probatio==0.13.0 tzdata
      - run: python -m pytest -q tests
      - run: python -m pytest -q device_library/tests
      - run: python -m compileall -q custom_components
  actual-ha-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test-runtime.txt
      - run: python -m pytest -q runtime_tests
      - run: python tools/package.py
      - run: python tools/validate_release.py
      - run: |
          python - <<'PY'
          import importlib
          for part in ('', '.config_flow', '.sensor', '.binary_sensor', '.number', '.select', '.switch', '.button', '.diagnostics'):
              importlib.import_module('custom_components.househeating' + part)
          PY
