name: Custom integration checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  adapter-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest pytest-asyncio
      - run: python -m pytest -q tests
      - run: python -m pytest -q device_library/tests
      - run: python -m compileall -q custom_components
  actual-ha-imports:
    # This smoke check has NOT been executed in the authoring environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.1 'modbus-connection[tmodbus]==4.12.4' pymodbus==3.13.1 tmodbus==0.6.2
      - run: |
          python - <<'PY'
          import importlib
          for part in ('', '.config_flow', '.sensor', '.binary_sensor', '.number', '.select', '.switch', '.button', '.diagnostics'):
              importlib.import_module('custom_components.househeating' + part)
          PY
