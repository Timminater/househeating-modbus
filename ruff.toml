# Shared style for the integration, the device library, tests and tools.
# Generated copies (custom_components/househeating/_vendor and core_integration)
# are refreshed by tools/vendor_library.py and are not formatted separately.
line-length = 120
target-version = "py313"
extend-exclude = ["custom_components/househeating/_vendor", "core_integration"]

[lint]
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "I"]
ignore = [
    "E731",  # small lambdas as command plans are intentional
    "B905",  # zip() strictness is not needed for the fixed tables here
]

[lint.isort]
known-first-party = ["househeating_modbus", "custom_components"]

[lint.per-file-ignores]
"tests/*" = ["E402"]
"runtime_tests/*" = ["E402", "B018"]
"device_library/tests/*" = ["E402", "B018"]
