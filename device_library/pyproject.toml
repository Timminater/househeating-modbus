[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "househeating-modbus"
version = "0.1.0"
description = "Backend-neutral HouseHeating / SolarEast heat-pump register protocol"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["modbus-connection>=4.12.4,<5"]

[project.optional-dependencies]
cli = ["modbus-connection[tmodbus]>=4.12.4,<5"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
househeating-read = "househeating_modbus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/househeating_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
